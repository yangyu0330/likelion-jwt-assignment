<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="google" content="notranslate">
<title>JWT 발급 실습 | 양유상</title>
<style>body{font-family:Arial,'Malgun Gothic',sans-serif;max-width:1080px;margin:32px auto;padding:0 24px;color:#19273c;background:#f5f7fb}h1{margin:8px 0}p{line-height:1.6}.card{background:white;border:1px solid #dce3ee;border-radius:12px;padding:22px;margin:18px 0}label{font-weight:bold}input,button{font:inherit;padding:10px 16px;border:1px solid #bbc9dc;border-radius:6px}button{background:#2458ba;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px;background:#f1f4f9;padding:16px;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}small{color:#516580}#status{font-weight:bold;color:#2458ba}</style>
<small>멋쟁이사자처럼 14기 · 양유상</small><h1>JSONPlaceholder 사용자 JWT 발급</h1>
<p>사용자명을 입력하면 실제 <b>POST /login</b> 요청을 보냅니다. 사용자 정보 4개 · HS256 · 유효시간 10분</p>
<section class="card"><form id="login"><label for="username">username</label> <input id="username" value="Bret"> <button>POST /login 실행</button></form><p id="status">아직 요청하지 않았습니다.</p><small id="time"></small></section>
<div class="grid"><section class="card"><h2>요청 / 응답</h2><pre id="request">요청 대기</pre><pre id="response">응답 대기</pre></section><section class="card"><h2>Decoded Payload</h2><pre id="payload">발급 대기</pre><p id="ttl"></p><small>브라우저의 디코딩은 서명 검증이 아닙니다. 서명·만료 검증은 Node.js 테스트에서 별도로 실행합니다.</small></section></div>
<section class="card"><h2>발급된 JWT</h2><pre id="token">발급 대기</pre><a href="https://jwt.io" target="_blank" rel="noreferrer">jwt.io에서 Payload 확인</a></section>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const body={username:document.querySelector('#username').value};document.querySelector('#request').textContent='POST /login\nContent-Type: application/json\n\n'+JSON.stringify(body,null,2);document.querySelector('#status').textContent='요청 중...';for(const id of ['response','payload','token','ttl'])document.getElementById(id).textContent='';try{const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();document.querySelector('#status').textContent='HTTP '+res.status+' '+res.statusText;document.querySelector('#time').textContent=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (KST)';document.querySelector('#response').textContent=JSON.stringify(data.user?{user:data.user,token:'아래 발급된 JWT 영역 참조'}:data,null,2);if(data.token){document.querySelector('#token').textContent=data.token;const payload=JSON.parse(atob(data.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));document.querySelector('#payload').textContent=JSON.stringify(payload,null,2);document.querySelector('#ttl').textContent='exp - iat = '+(payload.exp-payload.iat)+'초 = '+((payload.exp-payload.iat)/60)+'분';}}catch(err){document.querySelector('#status').textContent='연결 오류: '+err.message;}});</script></html>
